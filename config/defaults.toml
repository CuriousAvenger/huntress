# Huntress reviewed defaults.
#
# These keys are flat because they map one-to-one to HUNTRESS_* environment
# variables and to the flat pydantic-settings model. Precedence is:
#   explicit CLI/init arguments > environment > .env > this file > code defaults
#
# Secrets belong in .env or the environment, never in this file.

# Runtime and paths -----------------------------------------------------------
data_dir = ".huntress"
mode = "lab"
operator = "local-operator"
log_level = "INFO"

# Model provider (default: local LM Studio, OpenAI-compatible) ---------------
model_provider = "openai_compatible"
model_id = "local-model"
model_base_url = "http://127.0.0.1:1234/v1"
model_api_key_env = "OPENAI_API_KEY"
model_temperature = 0.0
model_max_tokens = 2048
model_timeout_seconds = 120.0
model_max_turns = 4
model_total_token_limit = 24000
model_input_cost_per_million = 0.0
model_output_cost_per_million = 0.0

# Exegol MCP (verified against exegol-mcp 1.0.2) ----------------------------
# auto: builtin profiles use the in-process scanner and Exegol profiles use
# the MCP adapter. fake is permitted only in lab mode.
exegol_backend = "auto"
exegol_url = "http://127.0.0.1:2187/mcp"
exegol_container = "pentest"
exegol_timeout_seconds = 300.0
exegol_max_output_bytes = 1048576
exegol_allow_remote = false

# Budgets and limits (defence in depth; also persisted per engagement) ------
max_actions_per_engagement = 200
max_model_calls_per_engagement = 50
max_tokens_per_engagement = 500000
max_cost_usd_per_engagement = 5.0
max_wall_clock_seconds = 7200
max_requests_per_host_per_minute = 30
max_requests_per_engagement_per_minute = 60
max_concurrency = 2
approval_ttl_seconds = 3600

# Evidence ------------------------------------------------------------------
evidence_max_artifact_bytes = 10485760
evidence_retention_days = 90

# Reasoning -----------------------------------------------------------------
reasoning_enabled = false
reasoning_max_context_chars = 120000
reasoning_context_excerpt_chars = 1200
reasoning_max_evidence_items = 40

# Local lab -----------------------------------------------------------------
lab_host = "127.0.0.1"
lab_port = 8000
