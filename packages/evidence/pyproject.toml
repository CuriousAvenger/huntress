[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huntress-evidence"
version = "0.1.0"
description = "Immutable content-addressed artifact storage with provenance and redaction."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "huntress-contracts",
  "pydantic>=2.11,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huntress_evidence"]

[tool.uv.sources]
huntress-contracts = { workspace = true }
