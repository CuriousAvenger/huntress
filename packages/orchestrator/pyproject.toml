[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huntress-orchestrator"
version = "0.1.0"
description = "Durable engagement controller, workflow, lab server, and CLI."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "huntress-contracts",
  "huntress-governance",
  "huntress-persistence",
  "huntress-evidence",
  "huntress-scanning-fleet",
  "huntress-execution",
  "huntress-verification",
  "huntress-knowledge",
  "huntress-reasoning",
  "huntress-reporting",
  "typer>=0.15,<1",
  "rich>=13,<15",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huntress_orchestrator"]

[tool.uv.sources]
huntress-contracts = { workspace = true }
huntress-governance = { workspace = true }
huntress-persistence = { workspace = true }
huntress-evidence = { workspace = true }
huntress-scanning-fleet = { workspace = true }
huntress-execution = { workspace = true }
huntress-verification = { workspace = true }
huntress-knowledge = { workspace = true }
huntress-reasoning = { workspace = true }
huntress-reporting = { workspace = true }

[project.scripts]
huntress = "huntress_orchestrator.cli:main"
