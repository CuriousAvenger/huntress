[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huntress-persistence"
version = "0.1.0"
description = "SQLite persistence, durable state, action ledger, and audit hash chain."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "huntress-contracts",
  "pydantic>=2.11,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/huntress_persistence"]

[tool.uv.sources]
huntress-contracts = { workspace = true }
